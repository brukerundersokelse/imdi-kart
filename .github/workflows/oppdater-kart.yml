# Legges i repoet som .github/workflows/oppdater-kart.yml
name: Oppdater kart

on:
  schedule:
    - cron: "3-59/10 * * * *"   # GitHub kjører i praksis omtrent én gang i timen
  workflow_dispatch:             # gir knappen «Run workflow» i Actions-fanen
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Jobb 1: henter tall fra SurveyXact og lager nettsiden.
  # Feiler denne, publiseres ingenting, og kartet beholder forrige tall.
  hent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Hent tall fra SurveyXact
        env:
          SX_USER: ${{ secrets.SX_USER }}
          SX_PASSWORD: ${{ secrets.SX_PASSWORD }}
        run: |
          mkdir _site
          cp index.html _site/
          python3 oppdater_data.py --ut _site/data.json

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Jobb 2: publiserer. Egen jobb og ett nytt forsøk etter 30 sekunder,
  # fordi GitHub av og til ikke finner pakken rett etter opplasting.
  publiser:
    needs: hent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.forsok1.outputs.page_url || steps.forsok2.outputs.page_url }}
    steps:
      - id: forsok1
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Vent før nytt forsøk
        if: steps.forsok1.outcome == 'failure'
        run: sleep 30

      - id: forsok2
        if: steps.forsok1.outcome == 'failure'
        uses: actions/deploy-pages@v5
