<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Besvarelser per fylke og kommune</title>
<style>
  /* Farger og skrift kan tilpasses her. */
  :root {
    --bg: #F4F7F9;
    --ink: #13232F;
    --muted: #54667A;
    --line: #D3DCE4;
    --zero: #D7DFE6;      /* områder uten besvarelser */
    --ramp-lo: #A9D0EC;   /* få besvarelser */
    --ramp-hi: #0F3B63;   /* mange besvarelser */
    --bar: rgba(169, 208, 236, .55);
    --accent: #D96F12;    /* markering */
    --ok: #2B8A63;
    --tip-bg: #13232F;
    --tip-ink: #FFFFFF;
    --font: Seravek, "Gill Sans Nova", Ubuntu, Calibri, "DejaVu Sans", source-sans-pro, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1820;
      --ink: #E8EEF3;
      --muted: #9FB0BF;
      --line: #2A3B49;
      --zero: #25343F;
      --ramp-lo: #2B5378;
      --ramp-hi: #C4E3F8;
      --bar: rgba(43, 83, 120, .6);
      --accent: #F2A14A;
      --ok: #5CC49A;
      --tip-bg: #E8EEF3;
      --tip-ink: #0E1820;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1820;
    --ink: #E8EEF3;
    --muted: #9FB0BF;
    --line: #2A3B49;
    --zero: #25343F;
    --ramp-lo: #2B5378;
    --ramp-hi: #C4E3F8;
    --bar: rgba(43, 83, 120, .6);
    --accent: #F2A14A;
    --ok: #5CC49A;
    --tip-bg: #E8EEF3;
    --tip-ink: #0E1820;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 1rem/1.45 var(--font);
  }
  h1, h2, p, ol { margin: 0; }
  ol { padding: 0; list-style: none; }
  [hidden] { display: none !important; }

  .app {
    max-width: 1040px;
    margin: 0 auto;
    padding: clamp(16px, 3vw, 32px);
  }

  /* Topp */
  .top { margin-bottom: clamp(16px, 3vw, 28px); }
  .top h1 {
    font-size: 1.125rem;
    font-weight: 600;
    line-height: 1.3;
    max-width: 44ch;
  }
  .total {
    margin-top: 6px;
    font-size: 1.125rem;
    color: var(--muted);
  }
  .total strong {
    font-size: clamp(2.125rem, 6vw, 3rem);
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -0.01em;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    margin-right: .15em;
  }
  .status {
    margin-top: 4px;
    font-size: .9375rem;
    color: var(--muted);
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .dot {
    flex: none;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--muted);
    transform: translateY(-1px);
  }
  .status[data-state="ok"] .dot { background: var(--ok); }
  .status[data-state="stale"] .dot { background: var(--accent); }
  .dot.is-pulsing { animation: pulse 1.2s ease-out 1; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); }
    100% { box-shadow: 0 0 0 9px transparent; }
  }

  .notice {
    margin-bottom: 16px;
    padding: 10px 14px;
    border-left: 4px solid var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    font-size: .9375rem;
    max-width: 70ch;
  }

  /* Kart og liste */
  .stage {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(250px, .85fr);
    gap: clamp(20px, 3vw, 36px);
    align-items: stretch;
  }
  .map-box { position: relative; }
  #map {
    display: block;
    width: 100%;
    height: auto;
    touch-action: manipulation;
  }
  #map path {
    vector-effect: non-scaling-stroke;
    stroke: var(--bg);
    stroke-width: 1;
    stroke-linejoin: round;
  }
  #map .shape {
    fill: var(--ramp-hi);
    fill-opacity: var(--o, 1);
    cursor: pointer;
  }
  @supports (color: color-mix(in oklab, red, blue)) {
    #map .shape {
      fill: color-mix(in oklab, var(--ramp-hi) var(--p, 0%), var(--ramp-lo));
      fill-opacity: 1;
    }
  }
  #map .shape.is-zero { fill: var(--zero); fill-opacity: 1; }
  #map .shape.is-masked { fill: url(#hatch); fill-opacity: 1; }
  #map .shape.is-dim { fill: var(--zero); fill-opacity: .4; }
  #map .shape.is-open { display: none; }
  #map .kommune { cursor: default; }
  #map #outline { fill: none; stroke: var(--muted); stroke-width: .75; pointer-events: none; }
  #map #hl { fill: none; stroke: var(--accent); stroke-width: 2.5; pointer-events: none; }

  .tip {
    position: absolute;
    left: 0;
    top: 0;
    z-index: 2;
    pointer-events: none;
    padding: 6px 10px;
    border-radius: 6px;
    background: var(--tip-bg);
    color: var(--tip-ink);
    font-size: .875rem;
    line-height: 1.3;
    white-space: nowrap;
  }
  .tip b { display: block; font-weight: 600; }

  .legend {
    margin-top: 14px;
    font-size: .875rem;
    color: var(--muted);
  }
  .legend-title { color: var(--ink); margin-bottom: 8px; }
  .legend-row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px 22px; }
  .key { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
  .sw { width: 16px; height: 12px; border-radius: 2px; background: var(--zero); flex: none; }
  .sw.masked {
    background: repeating-linear-gradient(135deg, var(--muted) 0 2px, var(--zero) 2px 5px);
  }
  .scale { flex: 1 1 180px; max-width: 280px; }
  .scale-bar {
    height: 12px;
    border-radius: 2px;
    background: linear-gradient(to right, var(--ramp-lo), var(--ramp-hi));
    background: linear-gradient(to right in oklab, var(--ramp-lo), var(--ramp-hi));
  }
  .scale-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 3px;
    font-variant-numeric: tabular-nums;
  }

  .panel-col { position: relative; min-height: 0; }
  .panel {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
  }
  .panel-head { padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .panel-head h2 { font-size: 1.375rem; font-weight: 600; line-height: 1.25; }
  .panel-head p { margin-top: 2px; font-size: .9375rem; color: var(--muted); }
  .back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin: 0 0 10px -8px;
    padding: 6px 12px 6px 8px;
    border: 0;
    border-radius: 6px;
    background: none;
    color: var(--ink);
    font: inherit;
    font-size: .9375rem;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .back:hover { background: var(--bar); }
  .back svg { width: 14px; height: 14px; flex: none; }
  .list {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 8px 2px 2px;
    margin: 0 -2px;
  }
  .list li + li { margin-top: 2px; }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    width: 100%;
    padding: 6px 10px;
    border: 0;
    border-radius: 5px;
    background: linear-gradient(to right, var(--bar) var(--w, 0%), transparent var(--w, 0%));
    color: inherit;
    font: inherit;
    text-align: left;
  }
  button.row { cursor: pointer; }
  .row:hover, .row.is-hot { box-shadow: inset 0 0 0 2px var(--accent); }
  .row .val { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .row.is-zero { color: var(--muted); }
  .row.is-zero .val { font-weight: 400; }
  .unknown {
    padding-top: 10px;
    border-top: 1px solid var(--line);
    font-size: .875rem;
    color: var(--muted);
  }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .credit {
    margin-top: clamp(16px, 3vw, 28px);
    font-size: .8125rem;
    color: var(--muted);
  }
  .credit a { color: inherit; }

  @media (max-width: 720px) {
    .stage { grid-template-columns: minmax(0, 1fr); }
    .panel { position: static; }
    .list { overflow: visible; }
  }
  @media (prefers-reduced-motion: reduce) {
    .dot.is-pulsing { animation: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <h1 id="title"></h1>
    <p class="total"><strong id="total">–</strong><span id="total-label">besvarelser</span></p>
    <p class="status" id="status" role="status"><span class="dot" id="dot"></span><span id="status-text">Henter tall …</span></p>
  </header>

  <p class="notice" id="notice" hidden></p>

  <div class="stage">
    <section class="map-col" aria-label="Kart">
      <div class="map-box" id="map-box">
        <svg id="map" role="img" aria-label="Kart over Norge som viser antall besvarelser per fylke. De samme tallene står i listen ved siden av kartet.">
          <defs>
            <pattern id="hatch" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
              <rect width="28" height="28" style="fill: var(--zero); stroke: none"></rect>
              <rect width="9" height="28" style="fill: var(--muted); stroke: none"></rect>
            </pattern>
          </defs>
          <g id="g-f"></g>
          <g id="g-k"></g>
          <path id="outline" d=""></path>
          <path id="hl" d=""></path>
        </svg>
        <div class="tip" id="tip" hidden><b id="tip-name"></b><span id="tip-val"></span></div>
      </div>
      <div class="legend">
        <p class="legend-title" id="legend-title"></p>
        <div class="legend-row">
          <span class="key"><span class="sw"></span>Ingen besvarelser</span>
          <span class="key" id="key-masked" hidden><span class="sw masked"></span><span id="key-masked-text"></span></span>
          <div class="scale" id="scale">
            <div class="scale-bar"></div>
            <div class="scale-labels"><span id="s-lo">1</span><span id="s-mid"></span><span id="s-hi"></span></div>
          </div>
        </div>
      </div>
    </section>

    <section class="panel-col" aria-label="Tall">
      <div class="panel">
        <div class="panel-head">
          <button class="back" id="back" type="button" hidden>
            <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M9 2 4 7l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Hele Norge
          </button>
          <h2 id="scope">Fylker</h2>
          <p id="scope-sub"></p>
        </div>
        <ol class="list" id="list"></ol>
        <p class="unknown" id="unknown" hidden></p>
      </div>
    </section>
  </div>

  <p class="credit">Kartgrunnlag: <a href="https://www.kartverket.no/" target="_blank" rel="noopener">Kartverket</a> (CC BY 4.0)</p>
</main>

(function () {
  "use strict";

  /* ───────────── Innstillinger ───────────── */
  const CONFIG = {
    // Adressen til datafilen som oppdater_data.py skriver, f.eks. "data.json".
    // Tom verdi = kartet viser oppdiktede testdata.
    dataUrl: "data.json",
    // Hvor ofte kartet henter datafilen på nytt (sekunder).
    refreshSeconds: 60,
    // Overskrift. Brukes hvis datafilen ikke har feltet "survey".
    title: "IMDi – Brukerundersøkelse blant nyankomne innvandrere i opplæring 2026",
    // "auto" følger besøkendes lys/mørk-innstilling. Bruk "light" hvis siden
    // skal ligge i en iframe på en nettside som alltid er lys.
    theme: "auto"
  };
  /* ───────────────────────────────────────── */

  const GEO = JSON.parse(document.getElementById("geo").textContent);
  const SVG_NS = "http://www.w3.org/2000/svg";
  const $ = (id) => document.getElementById(id);
  const nf = new Intl.NumberFormat("nb-NO");
  const df = new Intl.DateTimeFormat("nb-NO", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
  const collator = new Intl.Collator("nb");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  const sideBySide = window.matchMedia("(min-width: 721px)");

  if (CONFIG.theme === "light" || CONFIG.theme === "dark") {
    document.documentElement.setAttribute("data-theme", CONFIG.theme);
  }

  const svg = $("map"), gF = $("g-f"), gK = $("g-k"), hl = $("hl"), outline = $("outline");
  const tip = $("tip"), mapBox = $("map-box"), list = $("list");
  const FULL = [0, 0, GEO.w, GEO.h];
  const ASPECT = GEO.w / GEO.h;
  svg.setAttribute("viewBox", FULL.join(" "));
  svg.style.aspectRatio = GEO.w + " / " + GEO.h;

  const demo = !CONFIG.dataUrl;
  let data = null;          // sist innleste tall
  let view = null;          // null = hele landet, ellers fylkesnummer
  let box = FULL.slice();   // gjeldende kartutsnitt
  let anim = 0;

  const kName = (id) => GEO.k[id].n.replace(/ - /g, " – ");
  const fName = (id) => GEO.f[id].n;
  const count = (n) => (n === 1 ? "1 besvarelse" : nf.format(n) + " besvarelser");

  /* ── Bygg kartet ── */
  const fEl = {}, kEl = {}, kGroup = {};
  for (const id in GEO.f) {
    const p = document.createElementNS(SVG_NS, "path");
    p.setAttribute("d", GEO.f[id].d);
    p.setAttribute("class", "shape fylke is-zero");
    p.dataset.id = id;
    gF.appendChild(p);
    fEl[id] = p;
    const g = document.createElementNS(SVG_NS, "g");
    g.style.display = "none";
    gK.appendChild(g);
    kGroup[id] = g;
  }
  for (const id in GEO.k) {
    const p = document.createElementNS(SVG_NS, "path");
    p.setAttribute("d", GEO.k[id].d);
    p.setAttribute("class", "shape kommune is-zero");
    p.dataset.id = id;
    kGroup[id.slice(0, 2)].appendChild(p);
    kEl[id] = p;
  }
  const kommunerI = {};
  for (const id in GEO.k) (kommunerI[id.slice(0, 2)] ||= []).push(id);

  /* ── Data ── */
  function toCount(v) {
    const n = Math.round(Number(v));
    return Number.isFinite(n) && n > 0 ? n : 0;
  }

  function normalize(raw) {
    if (!raw || typeof raw !== "object" || (typeof raw.kommuner !== "object" && typeof raw.fylker !== "object")) {
      throw new Error("Datafilen har ikke forventet format.");
    }
    const k = {};
    for (const [id, v] of Object.entries(raw.kommuner || {})) {
      const key = String(id).padStart(4, "0");
      if (key in GEO.k) k[key] = v === null ? null : toCount(v);
    }
    const f = {};
    for (const id in GEO.f) f[id] = 0;
    if (raw.fylker && typeof raw.fylker === "object") {
      for (const [id, v] of Object.entries(raw.fylker)) {
        const key = String(id).padStart(2, "0");
        if (key in f) f[key] = toCount(v);
      }
    } else {
      for (const id in k) if (k[id]) f[id.slice(0, 2)] += k[id];
    }
    const unknown = toCount(raw.unknown);
    const sum = Object.values(f).reduce((a, b) => a + b, 0) + unknown;
    const updated = raw.updated ? new Date(raw.updated) : null;
    return {
      survey: typeof raw.survey === "string" && raw.survey.trim() ? raw.survey.trim() : CONFIG.title,
      updated: updated && !isNaN(updated) ? updated : null,
      total: raw.total == null ? sum : toCount(raw.total),
      unknown: unknown,
      min: toCount(raw.min_count),
      f: f,
      k: k
    };
  }

  function demoData() {
    const big = { "0301": 520, "4601": 240, "5001": 190, "1103": 150, "4204": 120, "3301": 95, "3107": 90,
      "1108": 80, "5501": 70, "3205": 70, "3201": 60, "3105": 60, "4003": 60, "3403": 55, "3905": 55,
      "1804": 55, "1508": 50, "3907": 50, "3303": 40, "5601": 25 };
    const k = {};
    for (const id in GEO.k) {
      let h = 2166136261;
      for (const c of id) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
      const r = ((h >>> 0) % 1000) / 1000;
      k[id] = id in big ? big[id] : (r < 0.45 ? 0 : Math.round(Math.pow(r, 4) * 34) + 1);
    }
    return { survey: CONFIG.title, updated: new Date().toISOString(), unknown: 17, kommuner: k };
  }

  /* ── Fargeskala ── */
  function shade(el, v, max) {
    el.classList.remove("is-zero", "is-masked", "is-dim", "is-open");
    if (v === null) { el.classList.add("is-masked"); return; }
    if (!v) { el.classList.add("is-zero"); return; }
    const t = max <= 1 ? 1 : Math.sqrt((v - 1) / (max - 1));
    el.style.setProperty("--p", (t * 100).toFixed(1) + "%");
    el.style.setProperty("--o", (0.25 + 0.75 * t).toFixed(3));
  }

  /* ── Tegn ── */
  function render() {
    if (!data) return;
    $("title").textContent = data.survey;
    document.title = data.survey;
    $("total").textContent = nf.format(data.total);
    $("total-label").textContent = data.total === 1 ? "besvarelse" : "besvarelser";

    const active = list.contains(document.activeElement) ? document.activeElement.dataset.id : null;

    let rows, max;
    if (view === null) {
      max = Math.max(0, ...Object.values(data.f));
      for (const id in fEl) { shade(fEl[id], data.f[id], max); kGroup[id].style.display = "none"; }
      outline.setAttribute("d", "");
      rows = Object.keys(GEO.f).map((id) => ({ id: id, name: fName(id), v: data.f[id] }));
      $("scope").textContent = "Fylker";
      $("scope-sub").textContent = "Velg et fylke for å se kommunene.";
      $("legend-title").textContent = "Besvarelser per fylke";
    } else {
      const ids = kommunerI[view];
      const vals = ids.map((id) => (id in data.k ? data.k[id] : 0));
      max = Math.max(0, ...vals.map((v) => v || 0));
      for (const id in fEl) {
        fEl[id].classList.remove("is-zero", "is-masked", "is-dim", "is-open");
        fEl[id].classList.add(id === view ? "is-open" : "is-dim");
        kGroup[id].style.display = id === view ? "" : "none";
      }
      ids.forEach((id, i) => shade(kEl[id], vals[i], max));
      outline.setAttribute("d", GEO.f[view].d);
      rows = ids.map((id, i) => ({ id: id, name: kName(id), v: vals[i] }));
      const withAny = vals.filter((v) => v === null || v > 0).length;
      $("scope").textContent = fName(view);
      $("scope-sub").textContent = ids.length === 1
        ? count(data.f[view])
        : count(data.f[view]) + " fra " + withAny + " av " + ids.length + " kommuner";
      $("legend-title").textContent = "Besvarelser per kommune i " + fName(view);
    }
    $("back").hidden = view === null;

    // Liste
    const rank = (v) => (v === null ? 0.5 : v);
    rows.sort((a, b) => rank(b.v) - rank(a.v) || collator.compare(a.name, b.name));
    list.textContent = "";
    for (const r of rows) {
      const li = document.createElement("li");
      const el = document.createElement(view === null ? "button" : "div");
      if (view === null) el.type = "button";
      el.className = "row" + (r.v === 0 ? " is-zero" : "");
      el.dataset.id = r.id;
      el.style.setProperty("--w", (max && r.v ? Math.max(2, (r.v / max) * 100) : 0).toFixed(1) + "%");
      const name = document.createElement("span");
      name.textContent = r.name;
      const val = document.createElement("span");
      val.className = "val";
      val.textContent = r.v === null ? "< " + data.min : nf.format(r.v);
      if (r.v === null) val.setAttribute("aria-label", "færre enn " + data.min);
      el.append(name, val);
      li.appendChild(el);
      list.appendChild(li);
    }

    // Tegnforklaring
    $("scale").style.visibility = max > 0 ? "visible" : "hidden";
    $("s-hi").textContent = max > 1 ? nf.format(max) : "";
    $("s-mid").textContent = max > 3 ? nf.format(Math.round(1 + (max - 1) * 0.25)) : "";
    const masked = view !== null && data.min > 1;
    $("key-masked").hidden = !masked;
    if (masked) $("key-masked-text").textContent = "Færre enn " + data.min;

    const u = $("unknown");
    u.hidden = !(view === null && data.unknown > 0);
    if (!u.hidden) {
      u.textContent = count(data.unknown) + " mangler kommune og er med i totalen, men ikke i kartet.";
    }
    hideTip();
    if (active) {
      const el = list.querySelector('button[data-id="' + active + '"]');
      if (el) el.focus();
    }
  }

  /* ── Kartutsnitt ── */
  function target(id) {
    if (id === null) return FULL.slice();
    let [x, y, w, h] = GEO.f[id].b;
    const pad = Math.max(w, h) * 0.07;
    x -= pad; y -= pad; w += 2 * pad; h += 2 * pad;
    if (w / h > ASPECT) { const nh = w / ASPECT; y -= (nh - h) / 2; h = nh; }
    else { const nw = h * ASPECT; x -= (nw - w) / 2; w = nw; }
    return [x, y, w, h];
  }

  function zoomTo(to) {
    cancelAnimationFrame(anim);
    if (reduceMotion.matches) { box = to; svg.setAttribute("viewBox", box.join(" ")); return; }
    const from = box.slice(), t0 = performance.now(), dur = 520;
    const step = (now) => {
      const u = Math.min(1, (now - t0) / dur);
      const e = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
      box = from.map((v, i) => v + (to[i] - v) * e);
      svg.setAttribute("viewBox", box.map((v) => v.toFixed(1)).join(" "));
      if (u < 1) anim = requestAnimationFrame(step);
    };
    anim = requestAnimationFrame(step);
  }

  function setView(id, opts) {
    if (id !== null && !(id in GEO.f)) id = null;
    const prev = view;
    if (id === prev) return;
    view = id;
    clearHot();
    render();
    zoomTo(target(id));
    try { history.replaceState(null, "", id === null ? location.pathname + location.search : "#fylke-" + id); } catch (e) { /* iframe uten historikk */ }
    if (opts && opts.focus) {
      if (id !== null) $("back").focus();
      else {
        const row = list.querySelector('[data-id="' + prev + '"]');
        if (row) row.focus();
      }
    }
  }

  /* ── Markering og verktøytips ── */
  function clearHot() {
    hl.setAttribute("d", "");
    const hot = list.querySelector(".is-hot");
    if (hot) hot.classList.remove("is-hot");
  }
  function setHot(id, fromList) {
    clearHot();
    const geo = id.length === 2 ? GEO.f[id] : GEO.k[id];
    if (!geo) return;
    hl.setAttribute("d", geo.d);
    const row = list.querySelector('[data-id="' + id + '"]');
    if (row && !fromList) row.classList.add("is-hot");
    return row;
  }
  function tipText(id) {
    if (id.length === 2) return [fName(id), data ? count(data.f[id]) : ""];
    const v = data && id in data.k ? data.k[id] : 0;
    return [kName(id), !data ? "" : v === null ? "Færre enn " + data.min + " besvarelser" : v === 0 ? "Ingen besvarelser ennå" : count(v)];
  }
  function showTip(id, e) {
    const [name, val] = tipText(id);
    $("tip-name").textContent = name;
    $("tip-val").textContent = val;
    tip.hidden = false;
    const r = mapBox.getBoundingClientRect();
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = e.clientX - r.left - w / 2;
    let y = e.clientY - r.top - h - 14;
    x = Math.max(0, Math.min(r.width - w, x));
    if (y < 0) y = e.clientY - r.top + 18;
    tip.style.transform = "translate(" + Math.round(x) + "px," + Math.round(y) + "px)";
  }
  function hideTip() { tip.hidden = true; }

  svg.addEventListener("pointermove", (e) => {
    if (e.pointerType === "touch") return;
    const el = e.target.closest ? e.target.closest(".shape") : null;
    if (!el) { clearHot(); hideTip(); return; }
    setHot(el.dataset.id);
    showTip(el.dataset.id, e);
  });
  svg.addEventListener("pointerleave", () => { clearHot(); hideTip(); });
  svg.addEventListener("click", (e) => {
    const el = e.target.closest ? e.target.closest(".shape") : null;
    if (!el) { clearHot(); hideTip(); return; }
    const id = el.dataset.id;
    if (id.length === 2) { hideTip(); setView(id); return; }
    const row = setHot(id);
    showTip(id, e);
    if (row && sideBySide.matches) row.scrollIntoView({ block: "nearest" });
  });

  list.addEventListener("click", (e) => {
    const b = e.target.closest("button.row");
    if (b) setView(b.dataset.id, { focus: true });
  });
  list.addEventListener("pointerover", (e) => {
    const row = e.target.closest(".row");
    if (row) setHot(row.dataset.id, true);
  });
  list.addEventListener("pointerleave", clearHot);
  list.addEventListener("focusin", (e) => {
    const row = e.target.closest(".row");
    if (row) setHot(row.dataset.id, true);
  });
  list.addEventListener("focusout", clearHot);

  $("back").addEventListener("click", () => setView(null, { focus: true }));
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && view !== null) setView(null, { focus: document.activeElement === $("back") });
  });

  function fromHash() {
    const m = /^#fylke-(\d{2})$/.exec(location.hash);
    setView(m ? m[1] : null);
  }
  window.addEventListener("hashchange", fromHash);

  /* ── Status ── */
  function setStatus(state, text) {
    $("status").dataset.state = state;
    $("status-text").textContent = text;
  }
  function setNotice(text) {
    $("notice").hidden = !text;
    $("notice").textContent = text || "";
  }
  function pulse() {
    const d = $("dot");
    d.classList.remove("is-pulsing");
    void d.offsetWidth;
    d.classList.add("is-pulsing");
  }
  const when = (d) => df.format(d);

  /* ── Henting ── */
  const every = Math.max(10, Number(CONFIG.refreshSeconds) || 60);

  async function load() {
    if (document.hidden) return;
    try {
      const url = CONFIG.dataUrl + (CONFIG.dataUrl.includes("?") ? "&" : "?") + "_=" + Date.now();
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      data = normalize(await res.json());
      setNotice("");
      setStatus("ok", data.updated ? "Oppdatert " + when(data.updated) : "Hentet " + when(new Date()));
      pulse();
      render();
    } catch (err) {
      if (window.console) console.warn("Norgeskart:", err);
      if (data) {
        setStatus("stale", "Får ikke hentet nye tall akkurat nå. Viser tallene fra " + when(data.updated || new Date()) + ".");
      } else {
        setStatus("stale", "Ingen tall å vise ennå");
        setNotice("Får ikke hentet tall. Kartet prøver igjen om " + every + " sekunder.");
      }
    }
  }

  function startDemo() {
    const raw = demoData();
    data = normalize(raw);
    setNotice("Testdata. Kartet er ikke koblet til en datakilde ennå, så tallene er oppdiktet.");
    setStatus("ok", "Testdata, nye svar legges til hvert femte sekund");
    render();
    const ids = Object.keys(raw.kommuner).filter((id) => raw.kommuner[id] > 0);
    setInterval(() => {
      if (document.hidden) return;
      const n = 1 + Math.floor(Math.random() * 3);
      for (let i = 0; i < n; i++) raw.kommuner[ids[Math.floor(Math.random() * ids.length)]] += 1;
      raw.updated = new Date().toISOString();
      data = normalize(raw);
      render();
      pulse();
    }, 5000);
  }

  $("title").textContent = CONFIG.title;
  render();
  if (demo) startDemo();
  else {
    load();
    setInterval(load, every * 1000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
  }
  fromHash();
})();
</script>
</body>
